name: SSH ROM Build Runner

on:
  workflow_dispatch:

jobs:
  ssh-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Batas maksimal free runner (6 jam)

    steps:
      - name: 1. Bersihkan Storage (Wajib buat Build ROM)
        run: |
          echo "=== Storage Sebelum Bersih-bersih ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          echo "=== Storage Setelah Bersih-bersih (Sisa ~35GB+) ==="
          df -h

      - name: 2. Install Tools & Dependencies Android
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib \
            gcc-multilib git gnupg gperf libxml2 libxml2-utils lzops rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev libssl-dev byobu tmux
          
          # Install Repo Tool secara global
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: 3. Jalankan SSH Session (Upterm)
        uses: owenthereal/action-upterm@v1
